[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/*.json"
exclude_filter="docs/*,tests/*,scripts/verify*.gd,scripts/demo.gd,scripts/sync_blender.gd,scripts/blender_sync_core.gd,assets/fonts/NotoSansSC-Regular.otf"
export_path="build/windows/Souplife.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
